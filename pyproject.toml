[project]
name = "djoser"
version = "2.3.4"
description = "REST implementation of Django authentication system."
authors = [
    {name = "Sunscrapers", email = "info@sunscrapers.com"},
]
maintainers = [
    {name = "Tomasz Wojcik", email = "djoser@tomwojcik.com"},
]
license = {text = "MIT"}
readme = "README.rst"
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: Django",
    "Framework :: Django :: 3.2",
    "Framework :: Django :: 4.0",
    "Framework :: Django :: 4.1",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 5.1",
    "Framework :: Django :: 5.2",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "django>=3.2",
    "djangorestframework>=3.14",
    "djangorestframework-simplejwt>=5.0,<6.0",
    "social-auth-app-django>=5.0.0,<6.0.0",
]

[project.optional-dependencies]
djet = ["djet>=0.3.0,<0.4.0"]
webauthn = ["webauthn<1.0"]

# Dev dependencies live in PEP 735 groups so they are not published as
# extras in the wheel metadata; install with `uv sync --group <name>`.
[dependency-groups]
test = [
    "pytest>=7.2.2",
    "coverage>=7.2.2",
    "pytest-cov>=4.0.0",
    "pytest-django>=4.5.2",
    "tox>=4.4.8",
    "babel>=2.12.1",
    "pytest-mock>=3.14.0",
    "deepdiff>=8.0.1",
    "pytest-env>=1.1.3",
    "factory-boy>=3.3.0",
]
code-quality = [
    "black>=23.1,<26.0",
    "ruff>=0.8.0",
    "docformatter>=1.7.4",
    "pyupgrade>=3.3.1",
    "pre-commit-hooks>=4.4,<6.0",
    "pre-commit>=4.1.0",
]
docs = [
    "sphinx>=6.1.3",
    "toml>=0.10.2",
    "sphinx-rtd-theme>=1.2.0",
]

[project.urls]
Homepage = "https://github.com/sunscrapers/djoser"
Repository = "https://github.com/sunscrapers/djoser"
Documentation = "https://djoser.readthedocs.io/"

[tool.uv]
# social-auth-app-django 5.5 requires Django>=5.1 (CheckConstraint condition=);
# keep the lock compatible with the Django 3.2-5.0 rows of the CI matrix
# without constraining the published package metadata.
constraint-dependencies = ["social-auth-app-django<5.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
# Compiled translation catalogs are gitignored; without this hatchling
# excludes them from both the sdist and the wheel.
artifacts = ["djoser/locale/**/*.mo"]

[tool.hatch.build.targets.sdist]
include = ["/djoser"]

[tool.hatch.build.targets.wheel]
packages = ["djoser"]

[tool.black]
line-length = 88
target-version = ["py39", "py310", "py311", "py312", "py313"]
include = '\.pyi?$'
exclude = '''
(
  /(
      \.cache
    | \.eggs
    | \.git
    | \.hg
    | \.mypy_cache
    | \.pytest_cache
    | \.tox
    | \.venv
    | __pycache__
    | _build
    | buck-out
    | build
    | dist
    | docs
    | migrations
  )/
)
'''

[tool.ruff]
exclude = [
    "conf.py",
    ".venv",
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".ruff_cache",
    ".svn",
    ".tox",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
    "migrations"
]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F"]
fixable = ["A", "B", "C", "D", "E", "F"]
unfixable = []

[tool.docformatter]
recursive = true
pre-summary-newline = true
make-summary-multi-line = true
wrap-summaries = 88
wrap-descriptions = 88
in-place = true

[tool.pytest.ini_options]
minversion = "7.0"
DJANGO_SETTINGS_MODULE = "testproject.settings"
python_paths = ["testproject"]
addopts = "--tb=short --strict-markers"
markers = [
    "django_db: mark test to use django database"
]

[tool.coverage.run]
source = ["djoser"]
omit = ["*/tests/*", "*/migrations/*", "*/conftest.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "pass",
    "raise ImportError",
]
