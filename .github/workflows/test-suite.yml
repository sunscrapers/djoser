name: Tests
on:
  push:
    branches:
      - master
  pull_request:
  schedule:
    - cron: '0 0 * * 0'
  workflow_call:

# `uv run` would otherwise re-sync the environment to uv.lock and undo the
# matrix-specific Django/DRF pins installed with `uv pip install`.
env:
  UV_NO_SYNC: "1"

jobs:
  test:
    name: Python ${{ matrix.python-version }} - Django ${{ matrix.django-version }} - DRF ${{ matrix.drf-version }}${{ matrix.social-auth-version && format(' - social-auth-app-django {0}', matrix.social-auth-version) || '' }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', 3.11, 3.12, 3.13]
        # Oldest supported Django (an LTS) with the oldest supported DRF.
        django-version: ["5.2"]
        drf-version: [3.14]
        include:
          # Django 6.x requires Python >= 3.12. DRF 3.14 does not import on
          # Django >= 6.1, so these rows take latest DRF.
          - python-version: 3.12
            django-version: "6.0"
            drf-version: "latest"
          - python-version: 3.13
            django-version: "6.0"
            drf-version: "latest"
          - python-version: 3.12
            django-version: "latest"
            drf-version: "latest"
          - python-version: 3.13
            django-version: "latest"
            drf-version: "latest"
          # uv.lock resolves social-auth-app-django 7.x (social-auth-core 6);
          # the package metadata also allows 6.x (social-auth-core 5).
          - python-version: 3.12
            django-version: "5.2"
            drf-version: 3.14
            social-auth-version: "~=6.0"

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group test --extra webauthn

      # One resolver call for both: upgrading DRF on its own re-resolves
      # Django too and silently moved a 6.0 row onto 6.1.
      - name: Install Django and DRF versions
        run: |
          if [ "${{ matrix.django-version }}" = "latest" ]; then
            DJANGO="Django"
          else
            DJANGO="Django~=${{ matrix.django-version }}.0"  # latest patch of the minor
          fi
          if [ "${{ matrix.drf-version }}" = "latest" ]; then
            DRF="djangorestframework"
          else
            DRF="djangorestframework==${{ matrix.drf-version }}"
          fi
          uv pip install --upgrade "$DJANGO" "$DRF"

      - name: Install social-auth-app-django version
        if: matrix.social-auth-version
        run: uv pip install "social-auth-app-django${{ matrix.social-auth-version }}"

      - name: Show environment info
        run: |
          uv run python --version
          # -i because uv pip freeze normalizes names to lowercase (django==),
          # unlike pip which preserved the canonical Django== casing
          uv pip freeze | grep -iE 'djangorestframework|django|social-auth'

      - name: Run tests
        run: make test

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        continue-on-error: true
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          verbose: true
          token: ${{ secrets.CODECOV_TOKEN }}

  lock-file-check:
    name: Check uv.lock for changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      # No `uv sync` first: a plain sync re-locks and rewrites a stale
      # uv.lock on disk, which would make this check unfailable.
      - name: Check if uv.lock is up to date
        run: uv lock --check
